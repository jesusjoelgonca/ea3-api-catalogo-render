name: CI

# Integración continua: instala las dependencias y ejecuta la suite de pruebas
# en cada pull request y en cada actualización de main. La matriz cruza dos
# sistemas operativos y dos versiones de Python: la API no debe depender ni
# del sistema ni de la versión menor.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  pruebas:
    name: Pruebas (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Instalar las dependencias
        run: pip install -r requirements.txt

      - name: Compilar todos los módulos
        run: python -m compileall src tests wsgi.py

      - name: Ejecutar las pruebas unitarias
        run: python -m unittest discover -s tests -v
